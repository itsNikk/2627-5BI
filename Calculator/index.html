<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="calculator_v3.js" defer></script>
    <title>Calculator v3</title>
</head>

<body>
    <h1>Calcolatrice</h1>
    <label for="n1">
        Primo numero:
        <input type="number" id="n1" placeholder="Inserisci primo numero">
    </label>
    <br><br>
    <label for="operazione">Operazione:
        <select id="operazione">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="**">potenza</option>
            <option value="/">division</option>
            <option value="%">%</option>
            <option value="min">min</option>
            <option value="max">max</option>
            <option value="media">media</option>
            <!-- per provare l'esercizio 3 -->
            <option value="unk">unk</option>
        </select>
    </label>
    <br><br>
    <label for="n2">
        Secondo numero:
        <input type="number" id="n2" placeholder="Inserisci secondo numero">
    </label>
    <br>
    <button id="calcola">Calcola</button>
    <br><br>
    <button id="sumBtn">+</button>
    <button id="subBtn">-</button>
    <button id="mulBtn">*</button>
    <button id="divBtn">/</button>
    <button id="powBtn">**</button>
    <button id="modBtn">%</button>
    <button id="minBtn">min</button>
    <button id="maxBtn">max</button>
    <button id="mediaBtn">media</button>
    <h3>Risultato</h3>
    <p id="risultato"></p>
    <p id="messaggio"></p>
    <p id="aiuto"></p>
</body>

</html>
