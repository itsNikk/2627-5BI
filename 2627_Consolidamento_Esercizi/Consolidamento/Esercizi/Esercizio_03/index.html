<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Traduttore</title>
</head>

<body>
    <h1>Traduttore</h1>
    <label for="parola">Parola: <input type="text" id="parola"></label>
    <label for="lingua">Lingua:
        <select id="lingua">
            <option value="en">inglese</option>
            <option value="es">spagnolo</option>
            <option value="fr">francese</option>
            <option value="de">tedesco</option>
        </select>
    </label>
    <button id="traduci">Traduci</button>
    <p id="traduzione"></p>
    <p id="errore"></p>
</body>

</html>
